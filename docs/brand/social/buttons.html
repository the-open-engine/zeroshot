<!doctype html>
<!-- Source for the README social buttons; render steps are in docs/brand/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Spline Sans"; src: url("../assets/spline-sans.ttf") format("truetype"); font-weight: 100 900; }
:root { --pill: #171411; --pill-text: #FAF7F1; --rust: #C2240C; --cta-text: #FFFFFF; }
:root[data-theme="dark"] { --pill: #E6E6E6; --pill-text: #14110E; --rust: #DA4A2C; }
html, body { margin: 0; background: transparent; }
body { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px; }
.button {
  display: inline-flex; align-items: center; gap: 9px;
  height: 35px; padding: 0 16px 0 13px; box-sizing: border-box; border-radius: 6px;
  background: var(--pill); color: var(--pill-text);
  font: 600 16px/1 "Spline Sans", sans-serif; letter-spacing: 0.005em; white-space: nowrap;
}
.button svg { width: 20px; height: 20px; fill: var(--rust); flex: none; }
/* The primary call to action: the only filled rust button in the row. */
.button.cta { background: var(--rust); color: var(--cta-text); }
.button.cta svg { fill: currentColor; }
</style>
</head>
