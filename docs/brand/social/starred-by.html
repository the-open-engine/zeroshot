<!doctype html>
<!-- Source for the README "starred by engineers at" strip; render steps are in docs/brand/README.md.
     Companies come from the self-reported GitHub company field of zeroshot stargazers, each profile
     checked by hand, so the copy says "engineers at", never "used by". Marks are Simple Icons (CC0);
     Microsoft and Amazon come from v11, before Simple Icons removed them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Spline Sans"; src: url("../assets/spline-sans.ttf") format("truetype"); font-weight: 100 900; }
:root { --label: #6F675A; --name: #4A433A; }
:root[data-theme="dark"] { --label: #9A9184; --name: #C9C1B4; }
html, body { margin: 0; background: transparent; }
.strip { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 12px; }
.label { font: 500 11px/1 ui-monospace, "SFMono-Regular", menlo, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--label); }
/* Two rows (4 + 3) so the strip stays legible when GitHub scales it to a phone. */
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 24px; max-width: 400px; }
li { display: inline-flex; align-items: center; gap: 7px; color: var(--name); font: 500 15px/1 "Spline Sans", sans-serif; letter-spacing: -0.005em; white-space: nowrap; }
svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
</style>
</head>
