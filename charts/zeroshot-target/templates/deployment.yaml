apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zeroshot-target
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeroshot-target
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: target
          image: {{ printf "%s:%v" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) | quote }}
          args:
            - target
            - serve
            - --listen
            - 0.0.0.0:8080
            - --public-origin
            - {{ .Values.publicOrigin | quote }}
            - --storage
            - /var/lib/zeroshot/native-v2
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /.well-known/zeroshot-native-v2
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /.well-known/zeroshot-native-v2
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/zeroshot
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ printf "%s-data" .Release.Name | quote }}
