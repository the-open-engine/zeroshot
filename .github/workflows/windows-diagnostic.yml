name: Windows Job diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          $hostScript = Join-Path (Get-Location) '.github/scripts/test-windows-host.ps1'
          $fixture = Join-Path $env:RUNNER_TEMP 'test-host-fixture'
          New-Item -ItemType Directory -Path (Join-Path $fixture 'scripts') -Force | Out-Null
          Set-Content (Join-Path $fixture 'scripts/test-windows.ps1') "Write-Output 'independent test host ran'; exit 7"
          Push-Location $fixture
          & $hostScript
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 7) { throw "Expected fixture status 7, got $status" }
          Write-Output 'Test host preserved the failing test status and returned after cleanup'
          exit 0
