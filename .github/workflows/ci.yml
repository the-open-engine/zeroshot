name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      python: ${{ steps.paths.outputs.python }}
      tooling: ${{ steps.paths.outputs.tooling }}
      npm: ${{ steps.paths.outputs.npm }}
      docs: ${{ steps.paths.outputs.docs }}
      readme: ${{ steps.paths.outputs.readme }}
      readme_only: ${{ steps.paths.outputs.readme_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CI lanes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash .github/select-ci-lanes.sh | tee -a "$GITHUB_OUTPUT"

  quick-check:
    name: PR checks
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Opcore
        if: needs.classify.outputs.readme_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$RUNNER_TEMP/opcore"
          archive=opcore-v0.3.2-linux-x86_64.tar.gz
          mkdir -p "$directory"
          node scripts/distribution/github-release-asset.js the-open-engine/opcore v0.3.2 SHA256SUMS "$directory/SHA256SUMS"
          node scripts/distribution/github-release-asset.js the-open-engine/opcore v0.3.2 "$archive" "$directory/$archive"
          # Preserve the immutable archive binding published in the npm 0.3.2 package.
          echo "c88ec2e1e2cbcbc20aada9fad35811108f15a9f1b7e7a2f48a59a726eb3daaf9  $directory/$archive" | sha256sum --check -
          (cd "$directory" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$directory/$archive" -C "$directory" opcore-linux-x86_64/bin/opcore
          echo "$directory/opcore-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$directory/opcore-linux-x86_64/bin/opcore" --version

      - name: Check source structure before queue admission
        if: needs.classify.outputs.readme_only != 'true'
        run: opcore check --repo . --committed --comparison all --providers fast

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.classify.outputs.native == 'true'
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Check Rust formatting
        if: needs.classify.outputs.native == 'true'
        run: cargo fmt --all -- --check

      - name: Check repository tooling and workflow formatting
        run: |
          npm run lint
          npx --no-install prettier --check .github/workflows/*.yml

      - name: Test CI routing and delivery contracts
        run: >-
          node --test
          tests/tooling/ci-*.test.js
          tests/tooling/greptile-gate.test.js
          tests/tooling/release-contract.test.js
          tests/tooling/plugins.test.js

      - name: Check generated plugins and content versions
        env:
          PLUGIN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/plugins.js check --base "$PLUGIN_BASE_SHA"

  readme-check:
    name: README
    needs: classify
    if: needs.classify.outputs.readme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Check README formatting and documentation contracts
        run: |
          npx --no-install prettier --check README.md
          node --test tests/tooling/docs-agent-contract.test.js

  tooling-check:
    name: Repository tooling
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Lint repository tooling
        run: npm run lint

      - name: Run repository tooling tests
        run: npm test

      - name: Validate distribution contract
        run: npm run distribution:check

      - name: Validate generated protocol artifacts
        run: npm run protocol:check

  npm-check:
    name: npm package (${{ matrix.os }})
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.npm == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve package line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Lint npm and distribution code
        run: npm run lint

      - name: Test packed npm installation and distribution contracts
        run: >-
          node --test
          tests/tooling/distribution.test.js
          tests/tooling/npm-package-install.test.js
          tests/tooling/npm-shim.test.js
          tests/tooling/npm-skill-install.test.js

      - name: Validate distribution contract
        run: npm run distribution:check

  native-check:
    name: Native product (${{ matrix.os }})
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Test contributed native bridges
        run: >-
          python -m unittest discover
          -s zeroshot/src/harnesses/adapters/contributed/hermes/tests
          -p 'native_*_test.py'

      - name: Build pinned Restic sidecar for native tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux)
              target=x86_64-unknown-linux-musl
              executable=restic
              ;;
            Windows)
              target=x86_64-pc-windows-msvc
              executable=restic.exe
              ;;
            *)
              echo "unsupported native test runner: $RUNNER_OS" >&2
              exit 2
              ;;
          esac
          output_root="${RUNNER_TEMP//\\//}/zeroshot-restic"
          scripts/distribution/build-restic.sh "$output_root" "$target"
          restic_path="$output_root/$target/$executable"
          "$restic_path" version
          mkdir -p target/debug
          cp "$restic_path" "target/debug/$executable"
          chmod +x "target/debug/$executable"
          restic_test_path="$(pwd)/target/debug/$executable"
          if [[ "$RUNNER_OS" == Windows ]]; then
            restic_test_path="$(cygpath -w "$restic_test_path")"
          fi
          printf 'ZEROSHOT_RESTIC_TEST=%s\n' "$restic_test_path" >> "$GITHUB_ENV"

      - name: Build and test embedded UI
        shell: bash
        run: |
          npm --prefix ui ci --ignore-scripts
          npm --prefix ui run build
          npm --prefix ui test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --locked --package zeroshot --lib --features workspace
          cargo clippy --package zeroshot --all-targets --features ui -- -D warnings

      - name: Exercise Windows checkpoint storage before the full suite
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          ZEROSHOT_RESTIC="$ZEROSHOT_RESTIC_TEST"
          cargo test --package zeroshot --lib
          native_v2_supervisor::checkpoints:: -- --nocapture

      - name: Run workspace tests
        if: runner.os != 'Windows'
        run: |
          cargo test --workspace
          cargo test --package zeroshot --features ui

      - name: Run Windows workspace tests
        if: runner.os == 'Windows'
        run: ./.github/scripts/test-windows-host.ps1

      - name: Exercise real Restic checkpoint storage
        shell: bash
        run: >-
          ZEROSHOT_RESTIC="$ZEROSHOT_RESTIC_TEST"
          cargo test --package zeroshot --lib
          native_v2_supervisor::checkpoints::tests::real_restic_deduplicates_incremental_stages_and_restores_the_latest_bytes

      - name: Test hosted process and filesystem boundaries as root
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Exercise mapped namespaces on this disposable runner, including Ubuntu AppArmor hosts.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -f /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo -n sysctl -w kernel.unprivileged_userns_clone=1
          fi
          cargo test --package zeroshot --lib --no-run --message-format=json > "$RUNNER_TEMP/zeroshot-tests.json"
          python3 - "$RUNNER_TEMP/zeroshot-tests.json" <<'PYTHON'
          import json
          import subprocess
          import sys

          with open(sys.argv[1], encoding='utf-8') as source:
              artifacts = [json.loads(line) for line in source]
          executables = [
              artifact['executable']
              for artifact in artifacts
              if artifact.get('reason') == 'compiler-artifact'
              and artifact['target']['name'] == 'zeroshot_engine'
              and artifact['profile']['test']
              and artifact.get('executable')
          ]
          assert len(executables) == 1, executables
          subprocess.run(
              [
                  'sudo', '-n', 'env', 'ZEROSHOT_REQUIRE_USER_NAMESPACES=1',
                  executables[0], 'root_', '--test-threads=1',
              ],
              check=True,
          )
          PYTHON

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

      - name: Build and smoke canonical executable
        shell: bash
        run: |
          cargo build --locked --release --package zeroshot --bin zeroshot --features ui
          target/release/zeroshot --version
          node tests/tooling/smoke-ui.js --binary target/release/zeroshot${{ runner.os == 'Windows' && '.exe' || '' }}

  macos-check:
    name: macOS compilation
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build embedded UI
        run: |
          npm --prefix ui ci --ignore-scripts
          npm --prefix ui run build
      - name: Check macOS product and test compilation
        run: cargo check --locked --workspace --all-targets --features ui
      - name: Run macOS controller socket and workspace clone regressions
        run: >-
          ZEROSHOT_REQUIRE_APFS_CLONE=1
          cargo test --locked --package zeroshot --lib --features ui --
          native_v2_portable_controller::transport::unix::tests
          native_v2_supervisor::checkpoints::filesystem::tests::macos_
      - name: Run macOS workspace export regressions
        run: |
          cargo test --locked --package zeroshot --features ui --test native_v2_export_workspace
          cargo test --locked --package zeroshot --features ui --lib native_v2_cli::execution::export_workspace::tests
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Prepare pinned Restic for native controller tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) exit 2 ;;
          esac
          output_root="$RUNNER_TEMP/zeroshot-restic"
          scripts/distribution/build-restic.sh "$output_root" "$target"
          mkdir -p target/debug
          cp "$output_root/$target/restic" target/debug/restic
          target/debug/restic version
      - name: Run native macOS controller termination regressions
        run: |
          cargo test --locked --package zeroshot --features ui --test native_v2_cli_portable unix_controller
          cargo test --locked --package zeroshot --features ui --lib native_v2_portable_controller::process::shutdown_tests

  python-check:
    name: Python SDK
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK development dependencies
        run: >-
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          for workflow in sorted(Path('../../.github/workflows').glob('*.yml')):
              with workflow.open(encoding='utf-8') as source:
                  yaml.safe_load(source)
          PY

      - name: Lint and format check
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
          pydoclint src/zeroshot

      - name: Type check
        run: python -m mypy src examples

      - name: Run SDK tests
        run: python -m pytest

      - name: Compile SDK examples
        run: python -m compileall -q examples

      - name: Build and inspect a platform wheel
        env:
          SOURCE_DATE_EPOCH: 1704067200
          ZEROSHOT_PYTHON_VERSION: 8.0.0.post1
          ZEROSHOT_PYTHON_WHEEL_PLATFORM: manylinux_2_17_x86_64
          ZEROSHOT_BINARY: /bin/true
          ZEROSHOT_RESTIC_BINARY: /bin/true
        run: |
          python -m build --wheel --outdir dist/first
          python -m build --wheel --outdir dist/second
          cmp dist/first/*.whl dist/second/*.whl
          python -m twine check dist/first/*.whl
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(
              Path('dist/first').glob(
                  'the_open_engine_zeroshot-8.0.0.post1-py3-none-manylinux_2_17_x86_64.whl'
              )
          )
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          assert any(name.endswith('/zeroshot/_bin/zeroshot') for name in names), names
          assert any(name.endswith('/zeroshot/_bin/restic') for name in names), names
          PY

  docs-check:
    name: Strict documentation
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Test documentation and publication contracts
        run: >-
          node --test
          tests/tooling/docs-agent-contract.test.js
          tests/tooling/docs-versions.test.js
          tests/tooling/release-contract.test.js

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.lock
            docs/requirements.txt
            sdks/python/pyproject.toml

      - name: Install documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e './sdks/python[dev]' -r docs/requirements.lock

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          for workflow in sorted(Path('.github/workflows').glob('*.yml')):
              with workflow.open(encoding='utf-8') as source:
                  yaml.safe_load(source)
          PY

      - name: Build strict documentation
        run: |
          python tests/docs/render_metadata.py
          python -m mkdocs build --strict
          test -f site/manifest.json
          grep -q 'id="zeroshot.Client"' site/reference/python/client/index.html
          grep -q 'id="zeroshot.RunResult"' site/reference/python/results/index.html
          grep -q 'id="zeroshot.InvalidRequestError"' site/reference/python/errors/index.html

  target-image:
    name: Target image
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Build canonical target image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build --pull --platform linux/amd64 \
            --secret id=github_token,env=GH_TOKEN \
            --file docker/zeroshot-target/Dockerfile \
            --tag zeroshot-target:ci .

      - name: Smoke embedded UI and target restart
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker run --detach --publish 127.0.0.1:4185:8080 \
            zeroshot-target:ci target serve --listen 0.0.0.0:8080 \
            --public-origin http://127.0.0.1:4185 --storage /var/lib/zeroshot/native-v2)"
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          node tests/tooling/smoke-ui.js --url http://127.0.0.1:4185
          node tests/tooling/smoke-environment.js --url http://127.0.0.1:4185 \
            --revision "$(git rev-parse HEAD)" --container "$container"
          docker stop --time 20 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          docker start "$container"
          node tests/tooling/smoke-ui.js --url http://127.0.0.1:4185
          docker stop --time 20 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0

      - name: Smoke executable and bundled harnesses
        run: |
          docker run --rm --platform linux/amd64 zeroshot-target:ci --version
          docker run --rm --platform linux/amd64 --entrypoint codex zeroshot-target:ci --version
          docker run --rm --platform linux/amd64 --entrypoint claude zeroshot-target:ci --version
          docker run --rm --platform linux/amd64 --network none --read-only \
            --tmpfs /work:rw,nosuid,nodev,exec,size=512m,mode=0700,uid=10001,gid=10001 \
            --user 10001:10001 --env HOME=/work \
            --entrypoint copilot zeroshot-target:ci --no-auto-update --version
          docker run --rm --platform linux/amd64 --network none --read-only \
            --tmpfs /work:rw,nosuid,nodev,exec,size=512m,mode=0700,uid=10001,gid=10001 \
            --user 10001:10001 --env HOME=/work \
            --entrypoint pi zeroshot-target:ci --version

      - name: Smoke GitHub delivery pagination
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --user 10001:10001 \
            --mount "type=bind,src=${PWD}/docker/zeroshot-target/smoke-github.py,dst=/smoke.py,readonly" \
            --entrypoint /usr/bin/env \
            zeroshot-target:ci -i PATH=/usr/local/bin:/usr/bin:/bin python3 /smoke.py

      - name: Compile with the isolated runtime toolchains
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,exec,size=512m,mode=0700,uid=10001,gid=10001 \
            --user 10001:10001 \
            --mount "type=bind,src=${PWD}/docker/zeroshot-target/smoke-toolchains.sh,dst=/smoke.sh,readonly" \
            --mount "type=bind,src=${PWD}/rust-toolchain.toml,dst=/rust-toolchain.toml,readonly" \
            --entrypoint /usr/bin/env \
            zeroshot-target:ci -i HOME=/work/home PATH=/usr/local/bin:/usr/bin:/bin \
            /bin/sh /smoke.sh

  coverage-check:
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.native == 'true'
    uses: ./.github/workflows/coverage.yml

  opcore-check:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/opcore.yml

  required:
    name: required
    if: always()
    needs:
      [
        classify,
        quick-check,
        coverage-check,
        opcore-check,
        readme-check,
        tooling-check,
        npm-check,
        native-check,
        macos-check,
        python-check,
        docs-check,
        target-image,
      ]
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Require every selected lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUICK_RESULT: ${{ needs.quick-check.result }}
          COVERAGE_RESULT: ${{ needs.coverage-check.result }}
          OPCORE_RESULT: ${{ needs.opcore-check.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NATIVE_SELECTED: ${{ needs.classify.outputs.native }}
          PYTHON_SELECTED: ${{ needs.classify.outputs.python }}
          TOOLING_SELECTED: ${{ needs.classify.outputs.tooling }}
          NPM_SELECTED: ${{ needs.classify.outputs.npm }}
          DOCS_SELECTED: ${{ needs.classify.outputs.docs }}
          README_SELECTED: ${{ needs.classify.outputs.readme }}
          README_RESULT: ${{ needs.readme-check.result }}
          TOOLING_RESULT: ${{ needs.tooling-check.result }}
          NPM_RESULT: ${{ needs.npm-check.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          NATIVE_RESULT: ${{ needs.native-check.result }}
          MACOS_RESULT: ${{ needs.macos-check.result }}
          PYTHON_RESULT: ${{ needs.python-check.result }}
          IMAGE_RESULT: ${{ needs.target-image.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]] || {
            echo "::error::classify concluded with $CLASSIFY_RESULT"
            exit 1
          }
          case "$EVENT_NAME" in
            pull_request) QUICK_SELECTED=true; FULL_SELECTED=false ;;
            merge_group|workflow_dispatch) QUICK_SELECTED=false; FULL_SELECTED=true ;;
            *) echo "::error::Unsupported CI event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          require_result() {
            local selected="$1"
            local result="$2"
            local name="$3"
            local full_only="${4:-false}"
            [[ "$selected" == "true" || "$selected" == "false" ]] || {
              echo "::error::$name has invalid selection value: $selected"
              exit 1
            }
            if [[ "$full_only" == "true" && "$FULL_SELECTED" == "false" ]]; then
              selected=false
            fi
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "::error::$name concluded with $result"
              exit 1
            fi
            if [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "::error::$name should be skipped, got $result"
              exit 1
            fi
          }
          require_result "$QUICK_SELECTED" "$QUICK_RESULT" quick-check
          require_result "$FULL_SELECTED" "$OPCORE_RESULT" opcore-check
          require_result "$NATIVE_SELECTED" "$COVERAGE_RESULT" coverage-check true
          require_result "$README_SELECTED" "$README_RESULT" readme-check
          require_result "$TOOLING_SELECTED" "$TOOLING_RESULT" tooling-check true
          require_result "$NPM_SELECTED" "$NPM_RESULT" npm-check true
          require_result "$DOCS_SELECTED" "$DOCS_RESULT" docs-check true
          require_result "$NATIVE_SELECTED" "$NATIVE_RESULT" native-check true
          require_result "$NATIVE_SELECTED" "$MACOS_RESULT" macos-check true
          require_result "$NATIVE_SELECTED" "$IMAGE_RESULT" target-image true
          require_result "$PYTHON_SELECTED" "$PYTHON_RESULT" python-check true

      - name: Wait for Greptile review
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while true; do
            review_status="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$REVIEW_HEAD_SHA/check-runs?per_page=100" |
              jq -r '[.[].check_runs[] | select(.app.id == 867647 and .name == "Greptile Review")] | max_by(.id) | .status // "pending"')"
            if [[ "$review_status" == "completed" ]]; then
              break
            fi
            echo "Waiting for Greptile to finish reviewing $REVIEW_HEAD_SHA ($review_status)"
            sleep 15
          done
