name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      python: ${{ steps.paths.outputs.python }}
      tooling: ${{ steps.paths.outputs.tooling }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CI lanes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ -z "$BASE_SHA" ]] ||
             [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            node .github/ci-path-classifier.js < /dev/null | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/ci-path-classifier.js |
            tee -a "$GITHUB_OUTPUT"

  tooling-check:
    name: Repository tooling
    needs: classify
    if: needs.classify.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Install Opcore Rust metrics analyzer
        run: npm run opcore:install:rust-metrics

      - name: Build Opcore graph
        run: npm run opcore:graph:build

      - name: Validate introduced changes
        env:
          CARGO_BUILD_JOBS: 1
          OPCORE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: npm run opcore:check -- --base "$OPCORE_BASE"

      - name: Lint repository tooling
        run: npm run lint

      - name: Run repository tooling tests
        run: npm test

      - name: Validate distribution contract
        run: npm run distribution:check

      - name: Validate generated protocol artifacts
        run: npm run protocol:check

  native-check:
    name: Native product
    needs: classify
    if: needs.classify.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

      - name: Build and smoke canonical executable
        run: |
          cargo build --locked --release --package zeroshot --bin zeroshot
          target/release/zeroshot --version

  python-check:
    name: Python SDK
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          for workflow in sorted(Path('../../.github/workflows').glob('*.yml')):
              with workflow.open(encoding='utf-8') as source:
                  yaml.safe_load(source)
          PY

      - name: Lint and format check
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples

      - name: Type check
        run: python -m mypy src examples

      - name: Run SDK tests
        run: python -m pytest

      - name: Build strict documentation and examples
        run: |
          python -m mkdocs build --strict
          python -m compileall -q examples

      - name: Build and inspect a platform wheel
        env:
          SOURCE_DATE_EPOCH: 1704067200
          ZEROSHOT_PYTHON_VERSION: 8.0.0.post1
          ZEROSHOT_PYTHON_WHEEL_PLATFORM: manylinux_2_17_x86_64
          ZEROSHOT_BINARY: /bin/true
        run: |
          python -m build --wheel --outdir dist/first
          python -m build --wheel --outdir dist/second
          cmp dist/first/*.whl dist/second/*.whl
          python -m twine check dist/first/*.whl
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(
              Path('dist/first').glob(
                  'the_open_engine_zeroshot-8.0.0.post1-py3-none-manylinux_2_17_x86_64.whl'
              )
          )
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          assert any(name.endswith('/zeroshot/_bin/zeroshot') for name in names), names
          PY

  target-image:
    name: Target image
    needs: classify
    if: needs.classify.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build canonical target image
        run: |
          docker build --platform linux/amd64 \
            --file docker/zeroshot-target/Dockerfile \
            --tag zeroshot-target:ci .

      - name: Smoke executable and bundled harnesses
        run: |
          docker run --rm --platform linux/amd64 zeroshot-target:ci --version
          docker run --rm --platform linux/amd64 --entrypoint codex zeroshot-target:ci --version
          docker run --rm --platform linux/amd64 --entrypoint claude zeroshot-target:ci --version

  required:
    name: required
    if: always()
    needs: [classify, tooling-check, native-check, python-check, target-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NATIVE_SELECTED: ${{ needs.classify.outputs.native }}
          PYTHON_SELECTED: ${{ needs.classify.outputs.python }}
          TOOLING_SELECTED: ${{ needs.classify.outputs.tooling }}
          TOOLING_RESULT: ${{ needs.tooling-check.result }}
          NATIVE_RESULT: ${{ needs.native-check.result }}
          PYTHON_RESULT: ${{ needs.python-check.result }}
          IMAGE_RESULT: ${{ needs.target-image.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]] || {
            echo "::error::classify concluded with $CLASSIFY_RESULT"
            exit 1
          }
          require_result() {
            local selected="$1"
            local result="$2"
            local name="$3"
            [[ "$selected" == "true" || "$selected" == "false" ]] || {
              echo "::error::$name has invalid selection value: $selected"
              exit 1
            }
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "::error::$name concluded with $result"
              exit 1
            fi
            if [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "::error::$name should be skipped, got $result"
              exit 1
            fi
          }
          require_result "$TOOLING_SELECTED" "$TOOLING_RESULT" tooling-check
          require_result "$NATIVE_SELECTED" "$NATIVE_RESULT" native-check
          require_result "$NATIVE_SELECTED" "$IMAGE_RESULT" target-image
          require_result "$PYTHON_SELECTED" "$PYTHON_RESULT" python-check
