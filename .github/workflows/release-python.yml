name: Release Python SDK

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build without publishing or release the complete Python SDK distribution.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release
      zeroshot_version:
        description: Existing Zeroshot release version in X.Y.Z form.
        required: true
        type: string
      sdk_revision:
        description: Positive SDK revision based on this Zeroshot release.
        required: true
        default: 1
        type: number
      release_commit:
        description: Exact full lowercase SDK source commit from main.
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI; disable only when trusted publishing is unavailable.
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      zeroshot_version:
        required: true
        type: string
      sdk_revision:
        required: true
        type: number
      release_commit:
        required: true
        type: string
      publish_pypi:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-python-${{ inputs.zeroshot_version }}-${{ inputs.sdk_revision }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      package-version: ${{ steps.release.outputs.package-version }}
      source-date-epoch: ${{ steps.release.outputs.source-date-epoch }}
      zeroshot-tag: ${{ steps.release.outputs.zeroshot-tag }}
      sdk-tag: ${{ steps.release.outputs.sdk-tag }}
      sdk-tag-exists: ${{ steps.release.outputs.sdk-tag-exists }}
    steps:
      - name: Validate explicit SDK release inputs
        shell: bash
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ZEROSHOT_VERSION: ${{ inputs.zeroshot_version }}
          SDK_REVISION: ${{ inputs.sdk_revision }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ACTION" == "dry-run" || "$RELEASE_ACTION" == "release" ]] || {
            echo "::error::action must be dry-run or release"
            exit 1
          }
          [[ "$ZEROSHOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::zeroshot_version must match X.Y.Z"
            exit 1
          }
          major="${ZEROSHOT_VERSION%%.*}"
          [[ "$major" -ge 8 ]] || {
            echo "::error::zeroshot_version must use major version 8 or newer"
            exit 1
          }
          [[ "$SDK_REVISION" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::sdk_revision must be a positive integer"
            exit 1
          }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_commit must be a full lowercase SHA"
            exit 1
          }

      - name: Checkout exact SDK release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_commit }}

      - name: Verify immutable Zeroshot base and independent SDK tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ZEROSHOT_VERSION: ${{ inputs.zeroshot_version }}
          SDK_REVISION: ${{ inputs.sdk_revision }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || {
            echo "::error::checkout did not resolve to $RELEASE_COMMIT"
            exit 1
          }
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || {
            echo "::error::release commit $RELEASE_COMMIT is not on main"
            exit 1
          }

          zeroshot_tag="v$ZEROSHOT_VERSION"
          zeroshot_commit="$(git rev-parse -q --verify "refs/tags/${zeroshot_tag}^{commit}")"
          git merge-base --is-ancestor "$zeroshot_commit" "$RELEASE_COMMIT" || {
            echo "::error::$zeroshot_tag is not an ancestor of SDK source $RELEASE_COMMIT"
            exit 1
          }
          gh release view "$zeroshot_tag" >/dev/null

          green_required="$(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "required" and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")] | length'
          )"
          [[ "$green_required" -gt 0 ]] || {
            echo "::error::$RELEASE_COMMIT has no successful CI / required check"
            exit 1
          }

          sdk_tag="zeroshot-python-v${ZEROSHOT_VERSION}_${SDK_REVISION}"
          package_version="${ZEROSHOT_VERSION}.post${SDK_REVISION}"
          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::release commit has no valid source date epoch"
            exit 1
          }
          sdk_tag_exists=false
          if sdk_commit="$(git rev-parse -q --verify "refs/tags/${sdk_tag}^{commit}")"; then
            [[ "$sdk_commit" == "$RELEASE_COMMIT" ]] || {
              echo "::error::$sdk_tag already resolves to $sdk_commit"
              exit 1
            }
            sdk_tag_exists=true
          fi
          {
            echo "commit=$RELEASE_COMMIT"
            echo "package-version=$package_version"
            echo "source-date-epoch=$source_date_epoch"
            echo "zeroshot-tag=$zeroshot_tag"
            echo "sdk-tag=$sdk_tag"
            echo "sdk-tag-exists=$sdk_tag_exists"
          } >> "$GITHUB_OUTPUT"

  wheels:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            executable: zeroshot
            wheel-platform: manylinux_2_17_x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            executable: zeroshot
            wheel-platform: manylinux_2_17_aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: zeroshot
            wheel-platform: macosx_11_0_x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            executable: zeroshot
            wheel-platform: macosx_11_0_arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            executable: zeroshot.exe
            wheel-platform: win_amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      ARCHIVE: zeroshot-v${{ inputs.zeroshot_version }}-${{ matrix.target }}.tar.gz
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source-date-epoch }}
      ZEROSHOT_TAG: ${{ needs.plan.outputs.zeroshot-tag }}
      ZEROSHOT_VERSION: ${{ inputs.zeroshot_version }}
      ZEROSHOT_PYTHON_VERSION: ${{ needs.plan.outputs.package-version }}
      ZEROSHOT_PYTHON_WHEEL_PLATFORM: ${{ matrix.wheel-platform }}
    steps:
      - name: Checkout exact SDK release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install wheel build tools
        working-directory: sdks/python
        run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0

      - name: Download matching immutable Zeroshot release executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native
          gh release download "$ZEROSHOT_TAG" \
            --pattern "$ARCHIVE" \
            --pattern SHA256SUMS \
            --dir native
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path('native')
          archive = os.environ['ARCHIVE']
          checksums = {}
          for line in (root / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              digest, name = line.split(maxsplit=1)
              checksums[name.removeprefix('*')] = digest
          expected = checksums.get(archive)
          assert expected is not None, f'SHA256SUMS has no entry for {archive}'
          actual = hashlib.sha256((root / archive).read_bytes()).hexdigest()
          assert actual == expected, f'checksum mismatch for {archive}'
          PY
          tar -xzf "native/$ARCHIVE" -C native
          reported_version="$("native/${{ matrix.executable }}" --version)"
          [[ "$reported_version" == "zeroshot $ZEROSHOT_VERSION" ]] || {
            echo "::error::$ARCHIVE contains unexpected version $reported_version"
            exit 1
          }
          binary_path="$(python - <<'PY'
          from pathlib import Path

          print(Path('native/${{ matrix.executable }}').resolve(strict=True))
          PY
          )"
          echo "ZEROSHOT_BINARY=$binary_path" >> "$GITHUB_ENV"

      - name: Build platform wheel containing the exact Zeroshot executable
        working-directory: sdks/python
        run: python -m build --wheel

      - name: Check built wheel metadata
        working-directory: sdks/python
        run: python -m twine check dist/*.whl

      - name: Upload SDK wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroshot-python-wheel-${{ matrix.target }}
          path: sdks/python/dist/*.whl
          if-no-files-found: error

  distribution:
    needs: [plan, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact SDK release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Download every SDK wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zeroshot-python-wheel-*
          path: sdk-release
          merge-multiple: true

      - name: Verify complete SDK distribution
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
        run: |
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check sdk-release/*.whl
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['PACKAGE_VERSION']
          wheels = sorted(Path('sdk-release').glob(f'the_open_engine_zeroshot-{version}-py3-none-*.whl'))
          assert len(wheels) == 5, wheels
          assert len({wheel.name for wheel in wheels}) == 5
          PY

      - name: Upload complete SDK distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroshot-python-distribution-${{ needs.plan.outputs.package-version }}
          path: sdk-release/*.whl
          if-no-files-found: error

  publish:
    needs: [plan, distribution]
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download exact SDK publication input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zeroshot-python-distribution-${{ needs.plan.outputs.package-version }}
          path: sdk-release

      - name: Setup Python 3.12
        if: inputs.publish_pypi
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Verify existing PyPI version before recovery
        if: inputs.publish_pypi
        id: pypi
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ['PACKAGE_VERSION']
          wheels = sorted(Path('sdk-release').glob('*.whl'))
          local = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in wheels
          }
          if len(local) != 5:
              raise SystemExit(f'expected five local wheels, found {sorted(local)}')

          url = f'https://pypi.org/pypi/the-open-engine-zeroshot/{version}/json'
          request = urllib.request.Request(url, headers={'User-Agent': 'zeroshot-release-verifier'})
          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
                  output.write('exists=false\n')
              raise SystemExit(0)

          remote = {
              entry['filename']: entry['digests']['sha256']
              for entry in payload.get('urls', [])
          }
          if remote != local:
              missing = sorted(local.keys() - remote.keys())
              unexpected = sorted(remote.keys() - local.keys())
              changed = sorted(
                  name for name in local.keys() & remote.keys() if local[name] != remote[name]
              )
              raise SystemExit(
                  'existing PyPI version differs from the exact publication input: '
                  f'missing={missing}, unexpected={unexpected}, changed={changed}'
              )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('exists=true\n')
          PY

      - name: Record intentionally deferred PyPI publication
        if: inputs.publish_pypi == false
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
        run: |
          message="PyPI publication for $PACKAGE_VERSION was explicitly disabled"
          message="$message because trusted publishing is unavailable."
          echo "::warning::$message"
          {
            echo "### PyPI publication deferred"
            echo
            echo "$message"
            echo "Rerun this workflow with the same immutable inputs and publish_pypi enabled to recover."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or complete independent SDK GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          SDK_TAG: ${{ needs.plan.outputs.sdk-tag }}
          SDK_TAG_EXISTS: ${{ needs.plan.outputs.sdk-tag-exists }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
        run: |
          set -euo pipefail
          if ! gh release view "$SDK_TAG" >/dev/null 2>&1; then
            if [[ "$SDK_TAG_EXISTS" == "true" ]]; then
              gh release create "$SDK_TAG" --verify-tag --latest=false \
                --title "Zeroshot Python SDK $PACKAGE_VERSION" \
                --notes "Python SDK $PACKAGE_VERSION for Zeroshot ${{ inputs.zeroshot_version }}."
            else
              gh release create "$SDK_TAG" --target "$RELEASE_COMMIT" --latest=false \
                --title "Zeroshot Python SDK $PACKAGE_VERSION" \
                --notes "Python SDK $PACKAGE_VERSION for Zeroshot ${{ inputs.zeroshot_version }}."
            fi
          fi

          gh release edit "$SDK_TAG" --latest=false
          mapfile -t remote_names < <(gh release view "$SDK_TAG" --json assets --jq '.assets[].name' | sort)
          declare -A expected=()
          for wheel in sdk-release/*.whl; do
            expected["$(basename "$wheel")"]="$wheel"
          done
          for name in "${remote_names[@]}"; do
            [[ -n "${expected[$name]:-}" ]] || {
              echo "::error::$SDK_TAG contains unexpected asset $name"
              exit 1
            }
          done

          existing_dir="$RUNNER_TEMP/zeroshot-python-existing-$PACKAGE_VERSION"
          mkdir -p "$existing_dir"
          for name in "${!expected[@]}"; do
            wheel="${expected[$name]}"
            if printf '%s\n' "${remote_names[@]}" | grep -Fxq "$name"; then
              gh release download "$SDK_TAG" --pattern "$name" --dir "$existing_dir"
              local_sha="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
              remote_sha="$(sha256sum "$existing_dir/$name" | cut -d ' ' -f 1)"
              [[ "$local_sha" == "$remote_sha" ]] || {
                echo "::error::$SDK_TAG asset $name differs from the exact publication input"
                exit 1
              }
            else
              gh release upload "$SDK_TAG" "$wheel"
            fi
          done

          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$latest_tag" != "$SDK_TAG" ]] || {
            echo "::error::Python SDK release must not own Latest"
            exit 1
          }

      - name: Publish Python SDK with trusted publishing
        if: inputs.publish_pypi && steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: sdk-release/
