name: Native coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coverage.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - 'ui/**'
      - 'zeroshot/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coverage.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - 'ui/**'
      - 'zeroshot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Rust line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
          components: llvm-tools-preview

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build pinned Restic sidecar for coverage
        shell: bash
        run: |
          output_root="$RUNNER_TEMP/zeroshot-restic"
          target=x86_64-unknown-linux-musl
          scripts/distribution/build-restic.sh "$output_root" "$target"
          restic_path="$output_root/$target/restic"
          "$restic_path" version
          printf 'ZEROSHOT_RESTIC=%s\n' "$restic_path" >> "$GITHUB_ENV"

      - name: Build embedded UI
        run: |
          npm --prefix ui ci --ignore-scripts
          npm --prefix ui run build

      - name: Install coverage tooling
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none

      - name: Measure native coverage
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '1'
          COVERAGE_IGNORE_REGEX: '(^|/)(tests(/|\.rs$)|test_support\.rs$|[^/]+[_-]tests\.rs$)'
          RUST_TEST_THREADS: '4'
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p target/llvm-cov-target/debug
          cp "$ZEROSHOT_RESTIC" target/llvm-cov-target/debug/restic
          chmod +x target/llvm-cov-target/debug/restic
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --package zeroshot --features ui --no-report
          # Run the hosted boundary tests instead of their non-root early returns.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo -n --preserve-env=LLVM_PROFILE_FILE' \
            cargo llvm-cov test --package zeroshot --lib --no-report root_ -- --test-threads=1
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --json --output-path coverage.json
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --lcov --output-path lcov.info

      - name: Summarize coverage quality
        id: coverage_quality
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('coverage.json', 'utf8')).data[0];
          const floors = { lines: 95, regions: 92, functions: 92 };
          const failures = [];

          for (const [kind, floor] of Object.entries(floors)) {
            const actual = report.totals[kind].percent;
            console.log(`${kind}: ${actual.toFixed(2)}% (minimum ${floor}%)`);
            if (actual < floor) failures.push(`${kind} ${actual.toFixed(2)}% < ${floor}%`);
          }

          for (const file of report.files) {
            const { lines, regions } = file.summary;
            if (regions.count < 150 || (lines.percent >= 80 && regions.percent >= 80)) continue;
            const path = file.filename.replace(`${process.cwd()}/`, '');
            failures.push(
              `${path}: ${lines.percent.toFixed(2)}% lines, ${regions.percent.toFixed(2)}% regions`,
            );
          }

          if (failures.length) {
            const weakest = report.files
              .filter((file) => file.summary.regions.count >= 100)
              .sort((left, right) => left.summary.regions.percent - right.summary.regions.percent)
              .slice(0, 20)
              .map((file) => {
                const path = file.filename.replace(`${process.cwd()}/`, '');
                const { lines, regions } = file.summary;
                return `${path}: ${lines.percent.toFixed(2)}% lines, ${regions.percent.toFixed(2)}% regions`;
              });
            console.warn(`Coverage goals not yet met:\n- ${failures.join('\n- ')}`);
            console.warn(`Weakest files with at least 100 regions:\n- ${weakest.join('\n- ')}`);
            process.exitCode = 1;
          } else {
            console.log('Coverage goals met.');
          }
          NODE

      - name: Publish coverage
        if: ${{ always() }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          fail-on-error: true
          coverage-reporter-version: v0.6.22

      - name: Enforce coverage quality
        if: ${{ always() }}
        env:
          COVERAGE_QUALITY_OUTCOME: ${{ steps.coverage_quality.outcome }}
        run: test "$COVERAGE_QUALITY_OUTCOME" = success
