        run: |
          python3 - <<'PY_PROBE'
          import base64, io, os, pathlib, zipfile
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ownership-probe'
          directory.mkdir()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROBE_BASE64']))) as archive:
              assert set(archive.namelist()) == {'native.c', 'runner.py', 'process_ownership_tests.rs'}
              archive.extractall(directory)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROBE_LOCATION=' + str(directory) + '\n')
          PY_PROBE
      - name: Prepare native fixture and record platform security
        run: python3 "$PROBE_LOCATION/runner.py" prepare
      - name: Exercise native process groups, discovery, launchd and Endpoint Security
        run: python3 "$PROBE_LOCATION/runner.py" native
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: process-ownership-feasibility
      - name: Compile probe against the actual Zeroshot process runner
        run: >-
          cargo test --locked -p zeroshot --no-default-features
          --test macos_process_ownership_probe --no-run --message-format=json
          > "$PROBE_LOCATION/build.jsonl"
      - name: Exercise actual runner cancellation, deadline, completion and owner death
        run: python3 "$PROBE_LOCATION/runner.py" production
      - name: Retain evidence and exact experiment sources
        if: always() && env.PROBE_LOCATION != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-process-ownership-${{ matrix.runner }}
          path: ${{ env.PROBE_LOCATION }}
          if-no-files-found: error
          retention-days: 14
