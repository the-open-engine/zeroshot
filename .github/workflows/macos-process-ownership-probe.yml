        run: |
          python3 - <<'PY_UNPACK'
          import base64, io, os, pathlib, zipfile
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'seatbelt-marker-probe'
          directory.mkdir()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROBE_BASE64']))) as archive:
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
              archive.extractall(directory)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROBE_LOCATION=' + str(directory) + '\n')
          PY_UNPACK
      - name: Compile unchanged upstream marker implementation
        run: |
          cargo build --locked --manifest-path "$PROBE_LOCATION/probe/Cargo.toml"
          cargo test --locked --manifest-path "$PROBE_LOCATION/probe/Cargo.toml" -- --nocapture
      - name: Record platform and compile native fixtures
        run: python3 "$PROBE_LOCATION/runner.py" prepare
      - name: Exercise detached children, nested policies, owner death and permissive access
        run: python3 "$PROBE_LOCATION/runner.py" test
      - name: Retain observations and exact sources
        if: always() && env.PROBE_LOCATION != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seatbelt-marker-${{ matrix.runner }}
          path: |
            ${{ env.PROBE_LOCATION }}/results
            ${{ env.PROBE_LOCATION }}/probe/src
            ${{ env.PROBE_LOCATION }}/probe/Cargo.toml
            ${{ env.PROBE_LOCATION }}/probe/Cargo.lock
            ${{ env.PROBE_LOCATION }}/probe/LICENSE-MXC.md
            ${{ env.PROBE_LOCATION }}/*.py
            ${{ env.PROBE_LOCATION }}/*.c
            ${{ env.PROBE_LOCATION }}/provenance.json
          if-no-files-found: error
          retention-days: 14
