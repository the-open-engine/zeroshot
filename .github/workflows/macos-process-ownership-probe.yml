        run: python3 "$PROBE_LOCATION/runner.py" prepare
      - name: Exercise native process groups, discovery, launchd and Endpoint Security
        run: python3 "$PROBE_LOCATION/runner.py" native
      - name: Retain evidence and exact experiment sources
        if: always() && env.PROBE_LOCATION != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
