        run: |
          python3 - <<'PY_PROBE'
          import base64, io, os, pathlib, zipfile
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ownership-probe'
          directory.mkdir()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROBE_BASE64']))) as archive:
              assert set(archive.namelist()) == {'native.c', 'runner.py', 'process_ownership_tests.rs'}
              archive.extractall(directory)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROBE_LOCATION=' + str(directory) + '\n')
          PY_PROBE
