name: Publish versioned documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact vX.Y.Z release to publish into vX.Y; omit to publish Current from main.
        required: false
        type: string
      release_commit:
        description: Exact release source commit; omit to resolve the release tag or current main.
        required: false
        type: string
      stable:
        description: Update the legacy stable redirect to this release's minor version.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Exact vX.Y.Z release to publish into its vX.Y documentation.
        required: true
        type: string
      release_commit:
        description: Exact full lowercase source commit for this release.
        required: true
        type: string
      stable:
        description: Update the legacy stable redirect to this release's minor version.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: publish-versioned-documentation
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_COMMIT: ${{ inputs.release_commit }}
      UPDATE_STABLE: ${{ inputs.stable || false }}
      GH_TOKEN: ${{ github.token }}
      ZEROSHOT_DOCS_PUBLISHER_COMMIT: ${{ github.workflow_sha }}
    steps:
      - name: Validate documentation identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_COMMIT" && ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be a full lowercase Git commit"
            exit 1
          fi
          if [[ -z "$REQUESTED_VERSION" ]]; then
            [[ "$UPDATE_STABLE" == "false" ]] || {
              echo "::error::Current documentation cannot advance the released stable redirect"
              exit 1
            }
            docs_version=current
            product_version=
          else
            [[ "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::version must match vX.Y.Z"
              exit 1
            }
            major="${REQUESTED_VERSION#v}"
            major="${major%%.*}"
            [[ "$major" -ge 8 ]] || {
              echo "::error::Zeroshot documentation versions must use major version 8 or newer"
              exit 1
            }
            docs_version="${REQUESTED_VERSION%.*}"
            product_version="${REQUESTED_VERSION#v}"
          fi
          {
            echo "DOCS_VERSION=$docs_version"
            echo "ZEROSHOT_DOCS_VERSION=$docs_version"
            echo "ZEROSHOT_PRODUCT_DOCS_VERSION=$product_version"
          } >> "$GITHUB_ENV"

      - name: Checkout exact documentation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_commit || inputs.version || 'main' }}

      - name: Checkout publication tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .docs-publisher

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force \
            +refs/heads/main:refs/remotes/origin/main
          source_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source_commit" origin/main || {
            echo "::error::documentation source $source_commit is not on main"
            exit 1
          }
          if [[ "$DOCS_VERSION" == "current" ]]; then
            main_commit="$(git rev-parse origin/main)"
            [[ "$source_commit" == "$main_commit" ]] || {
              echo "::error::Current documentation must use current main $main_commit"
              exit 1
            }
          else
            tag_commit="$(git rev-parse -q --verify "refs/tags/${REQUESTED_VERSION}^{commit}")"
            [[ "$tag_commit" == "$source_commit" ]] || {
              echo "::error::$REQUESTED_VERSION does not resolve to $source_commit"
              exit 1
            }
            if [[ "$UPDATE_STABLE" == "true" ]]; then
              latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
              [[ "$REQUESTED_VERSION" == "$latest_tag" ]] || {
                echo "::error::stable documentation must use the newest release $latest_tag"
                exit 1
              }
            fi
          fi
          {
            echo "SOURCE_COMMIT=$source_commit"
            echo "ZEROSHOT_DOCS_COMMIT=$source_commit"
          } >> "$GITHUB_ENV"

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .docs-publisher/docs/requirements.lock

      - name: Setup Rust 1.97.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Install documentation tools
        run: python -m pip install --disable-pip-version-check -r .docs-publisher/docs/requirements.lock

      - name: Apply publication policy to the exact source
        run: |
          cp .docs-publisher/scripts/docs_hook.py scripts/docs_hook.py
          cp .docs-publisher/docs/project/versioning.md docs/project/versioning.md

      - name: Verify generated CLI reference
        run: cargo run --locked -p zeroshot --example generate_cli_docs -- --check

      - name: Verify generated cluster protocol reference
        run: cargo run --locked -p openengine-cluster-testkit --bin generate-cluster-protocol -- --check

      - name: Build strict documentation
        run: python -m mkdocs build --strict

      - name: Verify rendered documentation and release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("site/manifest.json").read_text(encoding="utf-8"))
          product = os.environ["ZEROSHOT_PRODUCT_DOCS_VERSION"] or None
          expected = {
              "schemaVersion": 2,
              "docsVersion": os.environ["DOCS_VERSION"],
              "productVersion": product,
              "pythonSdkVersion": f"{product}.post1" if product else None,
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "publisherCommit": os.environ["ZEROSHOT_DOCS_PUBLISHER_COMMIT"],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"site/manifest.json has the wrong {key}")
          for route in manifest["routes"].values():
              relative = route + "index.html" if not route or route.endswith("/") else route
              if not (Path("site") / relative).is_file():
                  raise SystemExit(f"Missing documentation route: {relative}")
          python_anchors = {
              "site/reference/python/client/index.html": 'id="zeroshot.Client"',
              "site/reference/python/results/index.html": 'id="zeroshot.RunResult"',
              "site/reference/python/errors/index.html": 'id="zeroshot.InvalidRequestError"',
          }
          for relative, anchor in python_anchors.items():
              page = Path(relative).read_text(encoding="utf-8")
              if anchor not in page or "::: zeroshot" in page:
                  raise SystemExit(f"Python API directives did not render in {relative}")
          PY

      - name: Consolidate published patch versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local credential.helper \
            "!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          set +e
          git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null 2>&1
          remote_status="$?"
          set -e
          if [[ "$remote_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/gh-pages:refs/heads/gh-pages
            pages_dir="$RUNNER_TEMP/zeroshot-docs-migration"
            previous="$(git rev-parse refs/heads/gh-pages)"
            git worktree add --detach "$pages_dir" "$previous"
            python .docs-publisher/scripts/docs_versions.py migrate "$pages_dir"
            git -C "$pages_dir" add --all
            if ! git -C "$pages_dir" diff --cached --quiet; then
              git -C "$pages_dir" commit -m "docs: consolidate Current and minor versions"
              git update-ref refs/heads/gh-pages "$(git -C "$pages_dir" rev-parse HEAD)" "$previous"
            fi
            if [[ "$DOCS_VERSION" != "current" && -f "$pages_dir/$DOCS_VERSION/manifest.json" ]]; then
              python .docs-publisher/scripts/docs_versions.py check-update \
                "$pages_dir/$DOCS_VERSION/manifest.json" "$REQUESTED_VERSION" "$SOURCE_COMMIT"
            fi
            git worktree remove "$pages_dir"
          elif [[ "$remote_status" -ne 2 ]]; then
            echo "::error::could not inspect the remote gh-pages branch"
            exit 1
          fi

      - name: Initialize Current before a first release publication
        if: env.DOCS_VERSION != 'current'
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e refs/heads/gh-pages:current/manifest.json 2>/dev/null; then
            exit 0
          fi
          current_source="$RUNNER_TEMP/zeroshot-current-bootstrap"
          git worktree add --detach "$current_source" origin/main
          (
            cd "$current_source"
            export ZEROSHOT_DOCS_VERSION=current
            export ZEROSHOT_PRODUCT_DOCS_VERSION=
            export ZEROSHOT_DOCS_COMMIT="$(git rev-parse HEAD)"
            cp "$GITHUB_WORKSPACE/.docs-publisher/scripts/docs_hook.py" scripts/docs_hook.py
            cp "$GITHUB_WORKSPACE/.docs-publisher/docs/project/versioning.md" docs/project/versioning.md
            cargo run --locked -p zeroshot --example generate_cli_docs -- --check
            cargo run --locked -p openengine-cluster-testkit --bin generate-cluster-protocol -- --check
            mike deploy --config-file mkdocs.yml --alias-type redirect \
              --title Current --update-aliases current dev
          )
          git worktree remove --force "$current_source"

      - name: Publish Current or minor documentation locally
        shell: bash
        run: |
          set -euo pipefail
          aliases=()
          title="$DOCS_VERSION"
          if [[ "$DOCS_VERSION" == "current" ]]; then
            title=Current
            aliases=(dev)
          elif [[ "$UPDATE_STABLE" == "true" ]]; then
            aliases=(stable)
          fi
          mike deploy \
            --config-file mkdocs.yml \
            --message "docs: publish $DOCS_VERSION from $SOURCE_COMMIT" \
            --alias-type redirect \
            --title "$title" \
            --update-aliases \
            "$DOCS_VERSION" "${aliases[@]}"
          mike set-default --config-file mkdocs.yml current

      - name: Stage and push the complete site
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/zeroshot-pages"
          mkdir "$pages_dir"
          git archive refs/heads/gh-pages | tar -x -C "$pages_dir"
          test -f "$pages_dir/.nojekyll"
          test -f "$pages_dir/index.html"
          test -f "$pages_dir/versions.json"
          test -f "$pages_dir/current/manifest.json"
          test -f "$pages_dir/$DOCS_VERSION/manifest.json"
          git push origin refs/heads/gh-pages:refs/heads/gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the complete versioned site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/zeroshot-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
