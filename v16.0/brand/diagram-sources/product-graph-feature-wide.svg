<svg xmlns="http://www.w3.org/2000/svg" class="motion-ready custom-diagram custom-diagram--wide" viewBox="-16 -16 1252 722" role="group" aria-label="Custom graph example. The worker writes the change. Three reviewers run in parallel: acceptance, code review and a bugfinder that writes tests to break it. When all three accept, a ui reviewer boots only the frontend and clicks through the change. When it accepts, an adversarial end-to-end agent boots the whole stack and uses the feature like a hostile user. Then delivery. Any rejection at any stage returns to the worker with the reason, for at most 4 passes."><style><![CDATA[:root{--marker-ink:#26221c;--ink-2:#4a433a;--rust:#c2240c;--green:#2a7d3f;--hand:Caveat,cursive}
@font-face{font-family:Caveat;font-weight:600;src:url(../assets/caveat.ttf) format("truetype")}
.custom-diagram .stop path{stroke:var(--rust)}
.custom-diagram .stop text{fill:var(--rust)}
.custom-diagram .group path{stroke-width:2px;stroke-dasharray:.012 .008}
.custom-diagram .group-back path{opacity:.4}
.custom-diagram .group text{fill:var(--ink-2)}
.custom-diagram path{fill:none;stroke:var(--marker-ink);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round}
.custom-diagram text{font-family:var(--hand);fill:var(--marker-ink);font-weight:600}
.custom-diagram .edge-label text{fill:var(--ink-2)}
.custom-diagram .key text{fill:var(--ink-2)}
.custom-diagram .node>path{fill:#fff}
.custom-diagram .node-mark{pointer-events:none}
.custom-diagram .node-mark path,.legend-mark path{stroke-width:2.2px}
.custom-diagram .node-mark .disc{fill:#fff;stroke:none}
:is(.node-mark,.legend-mark) .solid{fill:var(--marker-ink)}
:is(.node-mark,.legend-mark) .ghost{opacity:.3}
.custom-diagram .repair-path path{stroke:var(--rust);stroke-dasharray:.025 .015}
.custom-diagram .repair-label text{fill:var(--rust)}
.custom-diagram .custom-flow{display:none}
.custom-diagram .custom-flow path{stroke:var(--rust);stroke-width:9px;stroke-dasharray:.001 2}
.custom-diagram .custom-fail{opacity:0}
.custom-diagram .custom-fail path,.custom-diagram .custom-pass path{stroke-width:4px}
.custom-diagram .custom-fail path{stroke:var(--rust)}
.custom-diagram .custom-pass path{stroke:var(--green)}
svg{background:#faf7f1}
@media (prefers-reduced-motion:no-preference){.motion-ready .custom-fail,.motion-ready .custom-pass,.motion-ready .custom-flow path{animation-duration:16s;animation-timing-function:linear;animation-play-state:paused;animation-fill-mode:both}.motion-ready.is-playing .custom-fail,.motion-ready.is-playing .custom-pass,.motion-ready.is-playing .custom-flow path{animation-play-state:running}.motion-ready .custom-flow{display:block}.motion-ready .flow-reviews path{animation-name:customFlowReviews}.motion-ready .flow-join path{animation-name:customFlowJoin}.motion-ready .flow-e2e path{animation-name:customFlowE2E}.motion-ready .flow-deliver path{animation-name:customFlowDeliver}.motion-ready .retry-reviews path{animation-name:customRetryReviews}.motion-ready .retry-e2e path{animation-name:customRetryE2E}.motion-ready .fail-reviews{animation-name:customFailReviews}.motion-ready .fail-e2e{animation-name:customFailE2E}.motion-ready .pass-acceptance,.motion-ready .pass-code{animation-name:customPassReview}.motion-ready .pass-bugfinder{animation-name:customPassBugfinder}.motion-ready .pass-ui{animation-name:customPassUi}.motion-ready .pass-e2e{animation-name:customPassE2E}.motion-ready .pass-deliver{animation-name:customPassDeliver}}@keyframes customFlowReviews{0%{stroke-dashoffset:.2px}5%,17.99%{stroke-dashoffset:-1.2px}18%{stroke-dashoffset:.2px}23%,59.99%{stroke-dashoffset:-1.2px}60%{stroke-dashoffset:.2px}65%,to{stroke-dashoffset:-1.2px}}@keyframes customFlowJoin{0%,27%{stroke-dashoffset:.2px}32%,69.99%{stroke-dashoffset:-1.2px}70%{stroke-dashoffset:.2px}75%,to{stroke-dashoffset:-1.2px}}@keyframes customFlowE2E{0%,37%{stroke-dashoffset:.2px}41%,80.99%{stroke-dashoffset:-1.2px}81%{stroke-dashoffset:.2px}85%,to{stroke-dashoffset:-1.2px}}@keyframes customFlowDeliver{0%,89%{stroke-dashoffset:.2px}93%,to{stroke-dashoffset:-1.2px}}@keyframes customRetryReviews{0%,9%{stroke-dashoffset:.2px}16%,to{stroke-dashoffset:-1.2px}}@keyframes customRetryE2E{0%,47%{stroke-dashoffset:.2px}55%,to{stroke-dashoffset:-1.2px}}@keyframes customFailReviews{0%,6.9%,18%,to{opacity:0}7%,17%{opacity:1}}@keyframes customFailE2E{0%,43.9%,59%,to{opacity:0}44%,58%{opacity:1}}@keyframes customPassReview{0%,6.9%,18%,24.9%,60%,66.9%{opacity:0}7%,17%,25%,59%,67%,to{opacity:1}}@keyframes customPassBugfinder{0%,24.9%,60%,66.9%{opacity:0}25%,59%,67%,to{opacity:1}}@keyframes customPassUi{0%,34.9%,60%,77.9%{opacity:0}35%,59%,78%,to{opacity:1}}@keyframes customPassE2E{0%,87.9%{opacity:0}88%,to{opacity:1}}@keyframes customPassDeliver{0%,95%{opacity:0}97%,to{opacity:1}}]]></style>
      <filter id="oe-ink-bleed">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" />
      </filter>
    <g class="node " data-json-node="worker" role="img" aria-label="worker. Implements the task in the shared repository. On a later pass it also reads every diagnostic from the pass before. Runs on a model you pick, e.g. opus. Emits nothing to the graph: it edits files."><path pathLength="1" d="M19.8 250.1 L190.3 249.9 L190.0 369.8 L20.2 369.9 Z"/><text x="105.0" y="320.2" text-anchor="middle" font-size="34">worker</text></g><g class="node-mark" transform="translate(24 254)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-12 12 L-8.5 3 L6 -11.5 L11.5 -6 L-3 8.5 Z"/><path d="M-8.5 3 L-3 8.5"/><path d="M2.5 -8 L8 -2.5"/></g><g class="node " data-json-node="acceptance" role="img" aria-label="acceptance review. Checks that the change does what the task asked, not only that it builds. Runs on a model you pick, e.g. sonnet. Emits verdict: accepted | rejected, with a diagnostic."><path pathLength="1" d="M279.3 40.0 L490.0 40.5 L490.4 160.3 L280.1 160.3 Z"/><text x="385.0" y="110.2" text-anchor="middle" font-size="34">acceptance</text></g><g class="node-mark" transform="translate(284 44)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-13 0 Q0 -12 13 0 Q0 12 -13 0 Z"/><path class="solid" d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node " data-json-node="code" role="img" aria-label="code review. Reads the diff for defects, missing tests and style. Runs on a model you pick, e.g. sonnet. Emits verdict: accepted | rejected, with a diagnostic."><path pathLength="1" d="M280.1 249.9 L490.5 249.8 L490.4 369.5 L280.3 369.3 Z"/><text x="385.0" y="320.2" text-anchor="middle" font-size="34">code review</text></g><g class="node-mark" transform="translate(284 254)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-13 0 Q0 -12 13 0 Q0 12 -13 0 Z"/><path class="solid" d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node " data-json-node="bugfinder" role="img" aria-label="bugfinder. Writes tests that try to break the change, runs them, then removes them. Runs on a model you pick, e.g. haiku. Emits verdict: accepted | rejected, with a diagnostic."><path pathLength="1" d="M279.7 459.6 L490.7 460.4 L490.4 579.7 L280.5 579.7 Z"/><text x="385.0" y="530.2" text-anchor="middle" font-size="34">bugfinder</text></g><g class="node-mark" transform="translate(284 464)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-13 0 Q0 -12 13 0 Q0 12 -13 0 Z"/><path class="solid" d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node " data-json-node="ui" role="img" aria-label="ui reviewer. Boots only the frontend from the runtime environment, clicks through the change like a user and judges what it sees. Runs on a model you pick, e.g. sonnet. Emits verdict: accepted | rejected, with a diagnostic."><path pathLength="1" d="M620.4 249.4 L799.3 250.6 L800.5 370.0 L620.0 369.9 Z"/><text x="710.0" y="319.6" text-anchor="middle" font-size="32">ui reviewer</text></g><g class="node-mark" transform="translate(624 254)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-13 0 Q0 -12 13 0 Q0 12 -13 0 Z"/><path class="solid" d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node-mark" transform="translate(796 366)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path class="solid" d="M0 -12 L12 -6 L0 0 L-12 -6 Z"/><path class="ghost" d="M-12 0 L0 6 L12 0"/><path class="ghost" d="M-12 6 L0 12 L12 6"/></g><g class="node " data-json-node="e2e" role="img" aria-label="adversarial e2e. Boots the whole stack, then uses the new feature the way a hostile user would: wrong input, odd order, a refresh mid-flow. Reports what broke. Runs on a model you pick, e.g. opus. Emits verdict: accepted | rejected, with a diagnostic."><path pathLength="1" d="M840.3 250.6 L1060.5 249.7 L1059.9 370.1 L839.6 369.7 Z"/><text x="950.0" y="319.6" text-anchor="middle" font-size="32">adversarial e2e</text></g><g class="node-mark" transform="translate(844 254)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M-13 0 Q0 -12 13 0 Q0 12 -13 0 Z"/><path class="solid" d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node-mark" transform="translate(1056 366)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path class="solid" d="M0 -12 L12 -6 L0 0 L-12 -6 Z"/><path d="M-12 0 L0 6 L12 0"/><path d="M-12 6 L0 12 L12 6"/></g><g class="node " data-json-node="deliver" role="img" aria-label="deliver. Commits, pushes, opens the pull request, waits for CI and merges. Only with --ship. Runs on built in. Emits a delivery receipt."><path pathLength="1" d="M1099.5 250.1 L1200.4 249.3 L1199.5 370.2 L1099.5 370.7 Z"/><text x="1150.0" y="320.2" text-anchor="middle" font-size="34">deliver</text></g><g class="node-mark" transform="translate(1104 254)"><path class="disc" d="M-19 0 a19 19 0 1 0 38 0 a19 19 0 1 0 -38 0"/><path d="M12.3 -2.0 L12.3 2.0 L8.2 2.2 L7.4 4.2 L10.1 7.3 L7.3 10.1 L4.3 7.4 L2.2 8.2 L2.0 12.3 L-2.0 12.3 L-2.2 8.2 L-4.2 7.4 L-7.3 10.1 L-10.1 7.3 L-7.4 4.2 L-8.2 2.2 L-12.3 2.0 L-12.3 -2.0 L-8.2 -2.2 L-7.4 -4.3 L-10.1 -7.3 L-7.3 -10.1 L-4.3 -7.4 L-2.2 -8.2 L-2.0 -12.3 L2.0 -12.3 L2.2 -8.2 L4.3 -7.4 L7.3 -10.1 L10.1 -7.3 L7.4 -4.3 L8.2 -2.2 Z"/><path d="M-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0"/></g><g class="node repair-label" data-json-node="repair" role="img" aria-label="repair loop. Any rejected verdict, at any stage, sends the worker another pass with that diagnostic, and every check runs again. Runs on the graph, no model. Emits maxIterations: 4, then the run fails."><text x="640" y="662.0" text-anchor="middle" font-size="30">any no: back to the worker with the reason.</text></g><g class="custom-edge"><path pathLength="1" d="M190 296 Q235 100 277 100"/><path pathLength="1" d="M265.3 105.7 L277.0 100.0 L265.3 94.3"/></g><g class="pulse custom-flow flow-reviews"><path pathLeng