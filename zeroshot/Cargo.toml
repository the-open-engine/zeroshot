[package]
name = "zeroshot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "zeroshot_engine"
path = "src/lib.rs"

[[bin]]
name = "zeroshot"
path = "src/main.rs"

[features]
ui = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:include_dir", "dep:schemars"]

[dependencies]
agent-client-protocol = { version = "=0.10.4", features = [
  "unstable_session_additional_directories",
  "unstable_session_close",
] }
axum = { version = "0.8", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
include_dir = { version = "0.7", optional = true }
schemars = { workspace = true, optional = true }
async-trait.workspace = true
clap.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
httparse.workspace = true
libc.workspace = true
keyring = { workspace = true, features = [
  "apple-native",
  "crypto-rust",
  "sync-secret-service",
  "windows-native",
] }
openengine-cluster-protocol.workspace = true
openengine_cluster_client.workspace = true
openengine-cluster-server.workspace = true
rusqlite.workspace = true
self-replace.workspace = true
reqwest.workspace = true
rpassword.workspace = true
ring.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
openengine-cluster-testkit.workspace = true
