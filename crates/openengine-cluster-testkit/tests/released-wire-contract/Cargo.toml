[package]
name = "zeroshot-released-wire-contract"
version = "0.0.0"
edition = "2024"
publish = false

# Keep the immutable released packages out of the product workspace's package selection.
[workspace]

[dependencies]
openengine-cluster-client = { path = "../../../openengine-cluster-client" }
openengine-cluster-protocol = { path = "../../../openengine-cluster-protocol" }
openengine-cluster-server = { path = "../../../openengine-cluster-server" }
zeroshot = { path = "../../../../zeroshot" }
released-client = { package = "openengine-cluster-client", git = "https://github.com/the-open-engine/zeroshot", rev = "df429ea0e36b5baa7eadb997e1a7efe276d95ae1" }
released-protocol = { package = "openengine-cluster-protocol", git = "https://github.com/the-open-engine/zeroshot", rev = "df429ea0e36b5baa7eadb997e1a7efe276d95ae1" }
released-server = { package = "openengine-cluster-server", git = "https://github.com/the-open-engine/zeroshot", rev = "df429ea0e36b5baa7eadb997e1a7efe276d95ae1" }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
