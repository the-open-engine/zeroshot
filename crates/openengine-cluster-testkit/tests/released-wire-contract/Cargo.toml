[package]
name = "zeroshot-released-wire-contract"
version = "0.0.0"
edition = "2024"
publish = false

# Keep the immutable released packages out of the product workspace's package selection.
[workspace]

[dependencies]
openengine-cluster-client = { path = "../../../openengine-cluster-client" }
openengine-cluster-protocol = { path = "../../../openengine-cluster-protocol" }
openengine-cluster-server = { path = "../../../openengine-cluster-server" }
# Actual pre-workspace main, including run/part and artifact contracts.
base-client = { package = "openengine-cluster-client", git = "https://github.com/the-open-engine/zeroshot", rev = "79ccf9effe15a47cf44b893421320816f8c1ce6f" }
base-protocol = { package = "openengine-cluster-protocol", git = "https://github.com/the-open-engine/zeroshot", rev = "79ccf9effe15a47cf44b893421320816f8c1ce6f" }
base-server = { package = "openengine-cluster-server", git = "https://github.com/the-open-engine/zeroshot", rev = "79ccf9effe15a47cf44b893421320816f8c1ce6f" }
released-client = { package = "openengine-cluster-client", git = "https://github.com/the-open-engine/zeroshot", rev = "15e17f792359cf6f6a0358918ad6146da57fb32f" }
released-protocol = { package = "openengine-cluster-protocol", git = "https://github.com/the-open-engine/zeroshot", rev = "15e17f792359cf6f6a0358918ad6146da57fb32f" }
released-server = { package = "openengine-cluster-server", git = "https://github.com/the-open-engine/zeroshot", rev = "15e17f792359cf6f6a0358918ad6146da57fb32f" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
